<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="dark">
<head>
    <meta charset="UTF-8" />
    <title>Library – MovieHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:Inter,system-ui,Arial,sans-serif}</style>
</head>
<body class="bg-black text-white min-h-screen">
<header class="sticky top-0 z-50 bg-black/80 border-b border-zinc-800/50 backdrop-blur">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <a href="/library" class="text-xl font-semibold">🎬MovieHub</a>
            <nav class="hidden md:flex items-center gap-6">
                <a href="/library" class="text-sm font-medium text-white">Library</a>
                <a href="/favorites" class="text-sm font-medium text-zinc-400 hover:text-white">Favorites</a>
            </nav>
        </div>
        <div class="flex items-center gap-3" th:if="${username == null}">
            <a href="/login" class="px-4 py-2 text-sm font-medium bg-white text-black rounded-lg hover:bg-zinc-200">Sign in</a>
            <a href="/signup" class="px-4 py-2 text-sm font-medium bg-white/10 hover:bg-white/20 rounded-lg">Sign up</a>
        </div>
        <div class="flex items-center gap-3" th:if="${username != null}">
            <span class="text-sm text-zinc-400">Hi, <span class="text-white font-semibold" th:text="${username}">user</span></span>
            <form action="/logout" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="px-3 py-2 text-sm font-medium bg-white/10 hover:bg-white/20 rounded-lg">Logout</button>
            </form>
        </div>
    </div>
</header>

<main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex items-center justify-between mb-6 gap-4">
        <h1 class="text-3xl font-bold">Popular Movies</h1>
        <form action="/search" method="get" class="flex gap-2">
            <input type="text" name="query" placeholder="Search movies..." required
                   class="px-3 py-2 rounded-md bg-black/50 border border-zinc-700 text-sm w-56 focus:outline-none focus:ring-2 focus:ring-blue-500/40" />
            <button class="px-3 py-2 rounded-md bg-white text-black text-sm font-semibold hover:bg-zinc-200">Search</button>
        </form>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
        <a th:each="m : ${movies}" th:href="@{'/movies/' + ${m.id}}"
           class="group rounded-xl overflow-hidden border border-zinc-800 bg-zinc-900/40 hover:border-zinc-700 transition">
            <div class="aspect-[2/3] bg-zinc-800">
                <img th:if="${m.posterPath != null}"
                     th:src="${'https://image.tmdb.org/t/p/w342' + m.posterPath}"
                     alt="Poster" class="w-full h-full object-cover group-hover:scale-[1.02] transition-transform duration-300"/>
            </div>
            <div class="p-3">
                <div class="text-sm font-semibold truncate" th:text="${m.title}">Title</div>
                <div class="text-xs text-zinc-400" th:text="${m.releaseDate}">YYYY-MM-DD</div>
            </div>
        </a>
    </div>

    <div class="mt-8 flex items-center justify-center gap-3">
        <a th:if="${page > 1}" th:href="@{/library(page=${page-1})}"
           class="px-3 py-2 rounded bg-white/10 hover:bg-white/20 text-sm">← Prev</a>
        <span class="text-sm text-zinc-400">Page <span class="text-white" th:text="${page}">1</span> / <span th:text="${totalPages}">1</span></span>
        <a th:if="${page < totalPages}" th:href="@{/library(page=${page+1})}"
           class="px-3 py-2 rounded bg-white/10 hover:bg-white/20 text-sm">Next →</a>
    </div>
</main>

<footer class="border-t border-zinc-800/50 mt-14">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 text-center text-sm text-zinc-500">© 2025 MovieHub. Powered by TMDB.</div>
</footer>
</body>
</html>
