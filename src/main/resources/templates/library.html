<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Favorites - MovieHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-black text-white min-h-screen">
<!-- Header -->
<header class="border-b border-zinc-800/50 backdrop-blur-sm sticky top-0 z-50 bg-black/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-8">
                <h1 class="text-xl font-semibold">🎬 MovieHub</h1>
                <nav class="hidden md:flex items-center gap-6">
                    <a href="/library" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Library</a>
                    <a href="/favorites" class="text-sm font-medium text-white">Favorites</a>
                </nav>
            </div>
            <div class="flex items-center gap-4">
                <button class="px-4 py-2 text-sm font-medium text-white bg-white/10 hover:bg-white/20 rounded-lg transition-colors">
                    Sign In
                </button>
            </div>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <!-- Breadcrumb -->
    <div class="mb-8">
        <a href="/library" class="text-sm text-zinc-400 hover:text-white transition-colors inline-flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to library
        </a>
    </div>

    <!-- Page Title -->
    <div class="mb-12">
        <h2 class="text-4xl font-bold mb-2 text-balance">Your Favorites</h2>
        <p class="text-zinc-400 text-lg">Movies you've saved for later</p>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(movies)}" class="text-center py-20">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-zinc-900 border border-zinc-800 mb-6">
            <svg class="w-10 h-10 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
        </div>
        <h3 class="text-2xl font-semibold mb-2">No favorites yet</h3>
        <p class="text-zinc-400 mb-8">Start adding movies to your favorites list</p>
        <a href="/library" class="inline-flex items-center gap-2 px-6 py-3 bg-white text-black font-semibold rounded-lg hover:bg-zinc-200 transition-colors">
            Browse Movies
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </a>
    </div>

    <!-- Favorites List -->
    <div th:if="${!#lists.isEmpty(movies)}" class="space-y-6">
        <div th:each="m : ${movies}" class="group">
            <div class="bg-zinc-900/50 border border-zinc-800/50 rounded-xl overflow-hidden hover:border-zinc-700 transition-all duration-300">
                <div class="flex flex-row sm:flex-row gap-6 p-6">
                    <!-- Poster -->
                    <a th:href="@{'/movies/' + ${m.id}}" class="flex-shrink-0">
                        <div class="w-full sm:w-32 aspect-[2/3] rounded-lg overflow-hidden bg-zinc-800 border border-zinc-700/50 group-hover:scale-105 transition-transform duration-300">
                            <img
                                    th:if="${m.posterPath != null}"
                                    th:src="${'https://image.tmdb.org/t/p/w342' + m.posterPath}"
                                    alt="Poster"
                                    class="w-full h-full object-cover"
                            />
                        </div>
                    </a>

                    <!-- Content -->
                    <div class="flex-1 min-w-0">
                        <a th:href="@{'/movies/' + ${m.id}}" class="block group/title">
                            <h3 class="text-xl font-semibold mb-2 group-hover/title:text-blue-400 transition-colors" th:text="${m.title}">Movie Title</h3>
                        </a>
                        <p class="text-sm text-zinc-400 mb-4">
                            <span th:text="${m.releaseDate}">2024-01-01</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="border-t border-zinc-800/50 mt-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <p class="text-center text-sm text-zinc-500">© 2025 MovieHub. Powered by TMDB.</p>
    </div>
</footer>
</body>
</html>
