<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="dark">
<head>
    <meta charset="UTF-8" />
    <title th:text="${movie.title}">Movie – MovieHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:Inter,system-ui,Arial,sans-serif}</style>
</head>
<body class="bg-black text-white min-h-screen">
<header class="sticky top-0 z-50 bg-black/80 border-b border-zinc-800/50 backdrop-blur">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <a href="/library" class="text-xl font-semibold">MovieHub</a>
            <nav class="hidden md:flex items-center gap-6">
                <a href="/library" class="text-sm font-medium text-zinc-400 hover:text-white">Library</a>
                <a href="/favorites" class="text-sm font-medium text-zinc-400 hover:text-white">Favorites</a>
                <a href="/search?query=" class="text-sm font-medium text-zinc-400 hover:text-white">Search</a>
            </nav>
        </div>
        <div class="flex items-center gap-3" th:if="${username == null}">
            <a href="/login" class="px-4 py-2 text-sm font-medium bg-white text-black rounded-lg hover:bg-zinc-200">Sign in</a>
            <a href="/signup" class="px-4 py-2 text-sm font-medium bg-white/10 hover:bg-white/20 rounded-lg">Sign up</a>
        </div>
        <div class="flex items-center gap-3" th:if="${username != null}">
            <span class="text-sm text-zinc-400">Hi, <span class="text-white font-semibold" th:text="${username}">user</span></span>
            <form action="/logout" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="px-3 py-2 text-sm font-medium bg-white/10 hover:bg-white/20 rounded-lg">Logout</button>
            </form>
        </div>
    </div>
</header>

<main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-10">
    <a href="/library" class="text-sm text-zinc-400 hover:text-white inline-flex items-center gap-1 mb-6">← Back to library</a>

    <div class="grid grid-cols-1 md:grid-cols-[300px_1fr] gap-8">
        <div>
            <div class="rounded-xl overflow-hidden border border-zinc-800 bg-zinc-900/40">
                <img th:if="${movie.posterPath != null}"
                     th:src="${'https://image.tmdb.org/t/p/w500' + movie.posterPath}"
                     alt="Poster" class="w-full h-auto object-cover"/>
            </div>
        </div>

        <div>
            <h1 class="text-3xl font-bold mb-3" th:text="${movie.title}">Movie title</h1>
            <div class="flex flex-wrap items-center gap-4 mb-4 text-sm">
                <span class="text-zinc-400">Release: <span class="text-white" th:text="${movie.releaseDate}">YYYY-MM-DD</span></span>
                <span class="px-2 py-1 rounded-full bg-zinc-900 border border-zinc-800">Rating:
          <span class="font-semibold" th:text="${#numbers.formatDecimal(movie.voteAverage,1,1)}">0.0</span>
        </span>
            </div>
            <p class="text-zinc-300 leading-relaxed mb-6" th:text="${movie.overview}">Overview…</p>

            <div th:if="${username == null}" class="mb-6">
                <a href="/login" class="px-4 py-2 bg-white text-black rounded-lg font-semibold hover:bg-zinc-200">Sign in to add favorites</a>
            </div>

            <div th:if="${username != null}">
                <div th:if="${!isFav}">
                    <form th:action="@{'/favorites/' + ${movie.id}}" method="post" class="inline-block">
                        <input type="hidden" name="from" value="movie"/>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="px-4 py-2 bg-white text-black rounded-lg font-semibold hover:bg-zinc-200">★ Add to favorites</button>
                    </form>
                </div>
                <div th:if="${isFav}">
                    <form th:action="@{'/favorites/' + ${movie.id} + '/remove'}" method="post" class="inline-block">
                        <input type="hidden" name="from" value="movie"/>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="px-4 py-2 bg-red-500/10 text-red-300 border border-red-500/30 rounded-lg font-semibold hover:bg-red-500/20">✖ Remove from favorites</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="border-t border-zinc-800/50 mt-14">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 text-center text-sm text-zinc-500">© 2025 MovieHub. Powered by TMDB.</div>
</footer>
</body>
</html>
