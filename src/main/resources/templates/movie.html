<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${movie.title}">Movie Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-black text-white min-h-screen">
<!-- Header -->
<header class="border-b border-zinc-800/50 backdrop-blur-sm sticky top-0 z-50 bg-black/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-8">
                <h1 class="text-xl font-semibold">🎬 MovieHub</h1>
                <nav class="hidden md:flex items-center gap-6">
                    <a href="/library" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Library</a>
                    <a href="/favorites" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Favorites</a>
                </nav>
            </div>
            <div class="flex items-center gap-4">
                <button class="px-4 py-2 text-sm font-medium text-white bg-white/10 hover:bg-white/20 rounded-lg transition-colors">
                    Sign In
                </button>
            </div>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <!-- Breadcrumb -->
    <div class="mb-8 flex items-center gap-3 text-sm">
        <a href="/library" class="text-zinc-400 hover:text-white transition-colors inline-flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to library
        </a>
        <span class="text-zinc-600">·</span>
        <a href="/favorites" class="text-zinc-400 hover:text-white transition-colors">Favorites</a>
    </div>

    <!-- Movie Details -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
        <!-- Poster -->
        <div class="lg:col-span-1">
            <div class="sticky top-24">
                <div class="aspect-[2/3] rounded-2xl overflow-hidden bg-zinc-900 border border-zinc-800/50 shadow-2xl">
                    <img
                            th:if="${movie.posterPath != null}"
                            th:src="${'https://image.tmdb.org/t/p/w500' + movie.posterPath}"
                            alt="Movie Poster"
                            class="w-full h-full object-cover"
                    />
                </div>
            </div>
        </div>

        <!-- Info -->
        <div class="lg:col-span-2">
            <!-- Title -->
            <h1 class="text-5xl font-bold mb-6 text-balance" th:text="${movie.title}">Movie Title</h1>

            <!-- Meta Info -->
            <div class="flex flex-wrap items-center gap-6 mb-8 pb-8 border-b border-zinc-800/50">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <span class="text-zinc-300 font-medium">Release:</span>
                    <span class="text-white" th:text="${movie.releaseDate}">2024-01-01</span>
                </div>

                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                    <span class="text-zinc-300 font-medium">Rating:</span>
                    <span class="text-white font-semibold" th:text="${#numbers.formatDecimal(movie.voteAverage,1,1)}">8.5</span>
                    <span class="text-zinc-500">/10</span>
                </div>
            </div>

            <!-- Overview -->
            <div class="mb-8">
                <h2 class="text-xl font-semibold mb-4">Overview</h2>
                <p class="text-zinc-300 text-lg leading-relaxed" th:text="${movie.overview}">
                    Movie overview and description goes here. This will be replaced with the actual movie description from the database.
                </p>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-4">
                <!-- Add to Favorites -->
                <div th:if="${!isFav}">
                    <form th:action="@{'/favorites/' + ${movie.id}}" method="post">
                        <input type="hidden" name="from" value="movie"/>
                        <button
                                type="submit"
                                class="inline-flex items-center gap-2 px-6 py-3 bg-white text-black font-semibold rounded-lg hover:bg-zinc-200 transition-colors"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                            </svg>
                            Add to favorites
                        </button>
                    </form>
                </div>

                <!-- Remove from Favorites -->
                <div th:if="${isFav}">
                    <form th:action="@{'/favorites/' + ${movie.id} + '/remove'}" method="post">
                        <input type="hidden" name="from" value="movie"/>
                        <button
                                type="submit"
                                class="inline-flex items-center gap-2 px-6 py-3 bg-red-500/10 text-red-400 font-semibold border border-red-500/20 rounded-lg hover:bg-red-500/20 hover:border-red-500/30 transition-colors"
                        >
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                            </svg>
                            Remove from favorites
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="border-t border-zinc-800/50 mt-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <p class="text-center text-sm text-zinc-500">© 2025 MovieHub. Powered by TMDB.</p>
    </div>
</footer>
</body>
</html>
