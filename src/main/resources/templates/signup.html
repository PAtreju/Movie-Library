<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="dark">
<head>
    <meta charset="UTF-8" />
    <title>Sign Up – MovieHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:Inter,system-ui,Arial,sans-serif}</style>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-zinc-900/50 border border-zinc-800/60 rounded-2xl p-8">
    <div class="text-center mb-6">
        <a href="/library" class="text-2xl font-bold">MovieHub</a>
        <p class="text-zinc-400 mt-1">Create a new account</p>
    </div>

    <form action="/signup" method="post" th:object="${form}" class="space-y-5">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
            <label class="block text-sm text-zinc-300 mb-1">Username</label>
            <input th:field="*{username}" type="text" required minlength="3" maxlength="50"
                   class="w-full px-3 py-2 rounded-lg bg-black/50 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
            <p class="text-red-400 text-xs mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Invalid</p>
        </div>

        <div>
            <label class="block text-sm text-zinc-300 mb-1">Email</label>
            <input th:field="*{email}" type="email" required
                   class="w-full px-3 py-2 rounded-lg bg-black/50 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
            <p class="text-red-400 text-xs mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Invalid</p>
        </div>

        <div>
            <label class="block text-sm text-zinc-300 mb-1">Password</label>
            <input th:field="*{password}" type="password" required minlength="6" maxlength="100"
                   class="w-full px-3 py-2 rounded-lg bg-black/50 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
            <p class="text-red-400 text-xs mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Invalid</p>
        </div>

        <button type="submit"
                class="w-full px-4 py-2 bg-white text-black font-semibold rounded-lg hover:bg-zinc-200">
            Create account
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-zinc-400">
        Already have an account?
        <a href="/login" class="text-blue-400 hover:text-blue-300 font-medium">Sign in</a>
    </p>
</div>
</body>
</html>
