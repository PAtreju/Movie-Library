<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MovieHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">
<!-- Background Pattern -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-500/5 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-500/5 rounded-full blur-3xl"></div>
</div>

<!-- Login Card -->
<div class="relative w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
        <a href="/library" class="inline-block">
            <h1 class="text-3xl font-bold mb-2">🎬 MovieHub</h1>
        </a>
        <p class="text-zinc-400">Sign in to your account</p>
    </div>

    <!-- Form Container -->
    <div class="bg-zinc-900/50 backdrop-blur-xl border border-zinc-800/50 rounded-2xl p-8 shadow-2xl">
        <form action="/login" method="post" class="space-y-6">
            <!-- Email Field -->
            <div>
                <label for="email" class="block text-sm font-medium text-zinc-300 mb-2">
                    Email address
                </label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="w-full px-4 py-3 bg-black/50 border border-zinc-800 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-transparent transition-all"
                        placeholder="you@example.com"
                />
            </div>

            <!-- Password Field -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label for="password" class="block text-sm font-medium text-zinc-300">
                        Password
                    </label>
                    <a href="/forgot-password" class="text-sm text-blue-400 hover:text-blue-300 transition-colors">
                        Forgot password?
                    </a>
                </div>
                <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-4 py-3 bg-black/50 border border-zinc-800 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-transparent transition-all"
                        placeholder="••••••••"
                />
            </div>

            <!-- Remember Me -->
            <div class="flex items-center">
                <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                        class="w-4 h-4 bg-black/50 border-zinc-800 rounded text-blue-500 focus:ring-2 focus:ring-blue-500/50"
                />
                <label for="remember" class="ml-2 text-sm text-zinc-400">
                    Remember me for 30 days
                </label>
            </div>

            <!-- Submit Button -->
            <button
                    type="submit"
                    class="w-full px-4 py-3 bg-white text-black font-semibold rounded-lg hover:bg-zinc-200 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-white/50"
            >
                Sign in
            </button>
        </form>

        <!-- Divider -->
        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-zinc-800"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-zinc-900/50 text-zinc-500">Or continue with</span>
            </div>
        </div>

        <!-- Social Login -->
        <div class="grid grid-cols-2 gap-4">
            <button class="px-4 py-3 bg-black/50 border border-zinc-800 rounded-lg text-sm font-medium hover:bg-black/70 transition-colors flex items-center justify-center gap-2">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/>
                </svg>
                Google
            </button>
            <button class="px-4 py-3 bg-black/50 border border-zinc-800 rounded-lg text-sm font-medium hover:bg-black/70 transition-colors flex items-center justify-center gap-2">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
                </svg>
                GitHub
            </button>
        </div>

        <!-- Sign Up Link -->
        <p class="mt-6 text-center text-sm text-zinc-400">
            Don't have an account?
            <a href="/signup" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">
                Sign up
            </a>
        </p>
    </div>

    <!-- Back to Library -->
    <div class="mt-6 text-center">
        <a href="/library" class="text-sm text-zinc-500 hover:text-zinc-400 transition-colors inline-flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to library
        </a>
    </div>
</div>
</body>
</html>
