<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Favorites – MovieHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:Inter,system-ui,Arial,sans-serif}</style>
</head>
<body class="bg-black text-white min-h-screen">
<header class="border-b border-zinc-800/50 backdrop-blur sticky top-0 z-50 bg-black/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <a href="/library" class="text-xl font-semibold">MovieHub</a>
            <nav class="hidden md:flex items-center gap-6">
                <a href="/library" class="text-sm font-medium text-zinc-400 hover:text-white">Library</a>
                <a href="/favorites" class="text-sm font-medium text-white">Favorites</a>
                <a href="/search?query=" class="text-sm font-medium text-zinc-400 hover:text-white">Search</a>
            </nav>
        </div>
        <div class="flex items-center gap-3" th:if="${username == null}">
            <a href="/login" class="px-4 py-2 text-sm font-medium bg-white text-black rounded-lg hover:bg-zinc-200">Sign in</a>
            <a href="/signup" class="px-4 py-2 text-sm font-medium bg-white/10 hover:bg-white/20 rounded-lg">Sign up</a>
        </div>
        <div class="flex items-center gap-3" th:if="${username != null}">
            <span class="text-sm text-zinc-400">Hi, <span class="text-white font-semibold" th:text="${username}">user</span></span>
            <form action="/logout" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="px-3 py-2 text-sm font-medium bg-white/10 hover:bg-white/20 rounded-lg">Logout</button>
            </form>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="mb-8">
        <a href="/library" class="text-sm text-zinc-400 hover:text-white inline-flex items-center gap-1">← Back to library</a>
    </div>

    <div class="mb-10">
        <h2 class="text-4xl font-bold mb-2">Your Favorites</h2>
        <p class="text-zinc-400 text-lg">Movies you've saved for later</p>
    </div>

    <div th:if="${#lists.isEmpty(movies)}" class="text-center py-20">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-zinc-900 border border-zinc-800 mb-6">
            <svg class="w-10 h-10 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        </div>
        <h3 class="text-2xl font-semibold mb-2">No favorites yet</h3>
        <p class="text-zinc-400 mb-8">Start adding movies to your favorites list</p>
        <a href="/library" class="inline-flex items-center gap-2 px-6 py-3 bg-white text-black font-semibold rounded-lg hover:bg-zinc-200">Browse Movies →</a>
    </div>

    <div th:if="${!#lists.isEmpty(movies)}" class="space-y-6">
        <div th:each="m : ${movies}" class="group">
            <div class="bg-zinc-900/50 border border-zinc-800/50 rounded-xl overflow-hidden hover:border-zinc-700 transition">
                <div class="flex flex-col sm:flex-row gap-6 p-6">
                    <a th:href="@{'/movies/' + ${m.id}}" class="flex-shrink-0">
                        <div class="w-full sm:w-32 aspect-[2/3] rounded-lg overflow-hidden bg-zinc-800 border border-zinc-700/50">
                            <img th:if="${m.posterPath != null}"
                                 th:src="${'https://image.tmdb.org/t/p/w342' + m.posterPath}"
                                 alt="Poster" class="w-full h-full object-cover"/>
                        </div>
                    </a>
                    <div class="flex-1 min-w-0">
                        <a th:href="@{'/movies/' + ${m.id}}" class="block">
                            <h3 class="text-xl font-semibold mb-2 hover:text-blue-400 transition-colors" th:text="${m.title}">Movie Title</h3>
                        </a>
                        <p class="text-sm text-zinc-400 mb-4" th:text="${m.releaseDate}">YYYY-MM-DD</p>
                        <form th:action="@{'/favorites/' + ${m.id} + '/remove'}" method="post" class="inline-block">
                            <input type="hidden" name="from" value="favorites"/>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-red-400 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 hover:border-red-500/30 rounded-lg">
                                ✖ Remove from favorites
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="border-t border-zinc-800/50 mt-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center text-sm text-zinc-500">© 2025 MovieHub. Powered by TMDB.</div>
</footer>
</body>
</html>
